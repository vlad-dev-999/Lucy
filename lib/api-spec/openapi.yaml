openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: overview
    description: Command centre summary
  - name: imports
    description: Legacy workbook imports and immutable baselines
  - name: departments
    description: Department vocabulary discovered from legacy workbooks
  - name: vocabulary
    description: Canonical vocabulary and human review decisions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /overview:
    get:
      operationId: getOverview
      tags: [overview]
      summary: Get command centre overview
      responses:
        "200":
          description: Current MMF cycle and import quality summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List departments detected from the baseline
      responses:
        "200":
          description: Department list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
  /imports:
    get:
      operationId: listImports
      tags: [imports]
      summary: List legacy workbook imports
      responses:
        "200":
          description: Import history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportSummary"
    post:
      operationId: createImport
      tags: [imports]
      summary: Save a validated import review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "201":
          description: Import review saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
  /imports/{importId}:
    get:
      operationId: getImport
      tags: [imports]
      summary: Get import review details
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: Import review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
        "404":
          description: Import not found
  /imports/{importId}/commit:
    post:
      operationId: commitImport
      tags: [imports]
      summary: Commit an immutable legacy baseline
      parameters:
        - $ref: "#/components/parameters/ImportId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitImportInput"
      responses:
        "200":
          description: Baseline committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
        "409":
          description: Import cannot be committed
        "404":
          description: Import not found
  /canonical-items:
    get:
      operationId: listCanonicalItems
      tags: [vocabulary]
      summary: Search canonical vocabulary
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [canonicalId, nomenclature, pvms, niv, status, legacyRecordCount, departmentCount]
            default: canonicalId
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Canonical vocabulary page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalItemPage"
    post:
      operationId: createCanonicalItem
      tags: [vocabulary]
      summary: Create a canonical item from immutable legacy records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCanonicalItemInput"
      responses:
        "201":
          description: Canonical item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalItemDetail"
        "409":
          description: A legacy record is already linked
  /canonical-items/{canonicalItemId}:
    get:
      operationId: getCanonicalItem
      tags: [vocabulary]
      summary: Get canonical item detail and lineage
      parameters:
        - $ref: "#/components/parameters/CanonicalItemId"
      responses:
        "200":
          description: Canonical item detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalItemDetail"
        "404":
          description: Canonical item not found
  /vocabulary-reviews:
    get:
      operationId: listVocabularyReviews
      tags: [vocabulary]
      summary: List vocabulary review records
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, all]
        - name: reviewType
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [createdAt, reviewType, status, identifier, title]
            default: createdAt
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Vocabulary review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyReviewPage"
  /vocabulary-reviews/{reviewId}/decision:
    post:
      operationId: decideVocabularyReview
      tags: [vocabulary]
      summary: Record a human vocabulary review decision
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyDecisionInput"
      responses:
        "200":
          description: Review decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyReview"
        "404":
          description: Review not found
        "409":
          description: Decision cannot be applied
components:
  parameters:
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
    CanonicalItemId:
      name: canonicalItemId
      in: path
      required: true
      schema:
        type: string
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    QualityIssue:
      type: object
      required: [code, severity, title, detail, rowNumbers]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [error, warning, review]
        title:
          type: string
        detail:
          type: string
        rowNumbers:
          type: array
          items:
            type: integer
    PreviewRow:
      type: object
      required: [sourceRow, systemId, identifier, nomenclature, unit, currentDglp, currentEchs]
      properties:
        sourceRow:
          type: integer
        systemId:
          type: ["string", "null"]
        identifier:
          type: ["string", "null"]
        nomenclature:
          type: ["string", "null"]
        specification:
          type: ["string", "null"]
        unit:
          type: ["string", "null"]
        pvms:
          type: ["string", "null"]
        niv:
          type: ["string", "null"]
        currentDglp:
          type: ["number", "null"]
        currentEchs:
          type: ["number", "null"]
    ImportInput:
      type: object
      required: [sourceFileName, sourceFileHash, worksheetName, rowCount, columnCount, departmentCount, uniqueIdentifierCount, missingIdentifierCount, conflictGroupCount, warnings, errors, previewRows]
      properties:
        sourceFileName:
          type: string
        sourceFileHash:
          type: string
        fileSize:
          type: integer
        worksheetName:
          type: string
        rowCount:
          type: integer
        columnCount:
          type: integer
        departmentCount:
          type: integer
        uniqueIdentifierCount:
          type: integer
        missingIdentifierCount:
          type: integer
        conflictGroupCount:
          type: integer
        warnings:
          type: integer
        errors:
          type: integer
        previewRows:
          type: array
          items:
            $ref: "#/components/schemas/PreviewRow"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/QualityIssue"
        legacyRows:
          type: array
          items:
            $ref: "#/components/schemas/LegacyRowInput"
        departments:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentInput"
        sourceObjectPath:
          type: ["string", "null"]
        sourceObjectContentType:
          type: ["string", "null"]
    CommitImportInput:
      type: object
      properties:
        acknowledged:
          type: boolean
    ImportSummary:
      type: object
      required: [id, sourceFileName, worksheetName, rowCount, departmentCount, status, createdAt, quality]
      properties:
        id:
          type: string
        sourceFileName:
          type: string
        worksheetName:
          type: string
        rowCount:
          type: integer
        columnCount:
          type: integer
        departmentCount:
          type: integer
        status:
          type: string
          enum: [review, committed]
        createdAt:
          type: string
        committedAt:
          type: ["string", "null"]
        quality:
          type: object
          required: [warnings, errors, conflicts, missingIdentifiers]
          properties:
            warnings:
              type: integer
            errors:
              type: integer
            conflicts:
              type: integer
            missingIdentifiers:
              type: integer
    ImportDetail:
      allOf:
        - $ref: "#/components/schemas/ImportSummary"
        - type: object
          required: [sourceFileHash, fileSize, uniqueIdentifierCount, previewRows, issues]
          properties:
            sourceFileHash:
              type: string
            fileSize:
              type: integer
            uniqueIdentifierCount:
              type: integer
            previewRows:
              type: array
              items:
                $ref: "#/components/schemas/PreviewRow"
            issues:
              type: array
              items:
                $ref: "#/components/schemas/QualityIssue"
    Department:
      type: object
      required: [id, name, itemCount, sourceColumnStart]
      properties:
        id:
          type: string
        name:
          type: string
        itemCount:
          type: integer
        sourceColumnStart:
          type: integer
    DepartmentInput:
      type: object
      required: [name, sourceColumnStart]
      properties:
        name:
          type: string
        sourceColumnStart:
          type: integer
    LegacyRowInput:
      type: object
      required: [sourceRow, sourceValues, departments]
      properties:
        sourceRow:
          type: integer
        systemId:
          type: ["string", "null"]
        identifier:
          type: ["string", "null"]
        nomenclature:
          type: ["string", "null"]
        specification:
          type: ["string", "null"]
        unit:
          type: ["string", "null"]
        pvms:
          type: ["string", "null"]
        niv:
          type: ["string", "null"]
        previousPvmsMmf:
          type: ["number", "null"]
        currentPvmsMmf:
          type: ["number", "null"]
        previousDglpMmf:
          type: ["number", "null"]
        currentDglpMmf:
          type: ["number", "null"]
        previousEchsMmf:
          type: ["number", "null"]
        currentEchsMmf:
          type: ["number", "null"]
        lpr:
          type: ["string", "null"]
        sourceValues:
          type: array
          items: {}
        departments:
          type: array
          items:
            type: object
            required: [departmentIndex]
            properties:
              departmentIndex:
                type: integer
              pvms:
                type: ["string", "null"]
              dglp:
                type: ["number", "null"]
              echs:
                type: ["number", "null"]
    CanonicalItem:
      type: object
      required: [id, canonicalId, nomenclature, unit, pvms, niv, status, legacyRecordCount, departmentCount]
      properties:
        id:
          type: string
        canonicalId:
          type: string
        nomenclature:
          type: ["string", "null"]
        unit:
          type: ["string", "null"]
        pvms:
          type: ["string", "null"]
        niv:
          type: ["string", "null"]
        status:
          type: string
        legacyRecordCount:
          type: integer
        departmentCount:
          type: integer
    LegacyItem:
      type: object
      required: [id, importId, sourceWorksheet, sourceRow, systemId, identifier, nomenclature, specification, unit, pvms, niv, previousPvmsMmf, currentPvmsMmf, previousDglpMmf, currentDglpMmf, previousEchsMmf, currentEchsMmf, lpr, sourceValues, departments]
      properties:
        id:
          type: string
        importId:
          type: string
        sourceWorksheet:
          type: string
        sourceRow:
          type: integer
        systemId:
          type: ["string", "null"]
        identifier:
          type: ["string", "null"]
        nomenclature:
          type: ["string", "null"]
        specification:
          type: ["string", "null"]
        unit:
          type: ["string", "null"]
        pvms:
          type: ["string", "null"]
        niv:
          type: ["string", "null"]
        previousPvmsMmf:
          type: ["number", "null"]
        currentPvmsMmf:
          type: ["number", "null"]
        previousDglpMmf:
          type: ["number", "null"]
        currentDglpMmf:
          type: ["number", "null"]
        previousEchsMmf:
          type: ["number", "null"]
        currentEchsMmf:
          type: ["number", "null"]
        lpr:
          type: ["string", "null"]
        sourceValues:
          type: array
          items: {}
        departments:
          type: array
          items:
            type: object
            required: [name, pvms, dglp, echs]
            properties:
              name:
                type: string
              pvms:
                type: ["string", "null"]
              dglp:
                type: ["number", "null"]
              echs:
                type: ["number", "null"]
    CanonicalItemDetail:
      allOf:
        - $ref: "#/components/schemas/CanonicalItem"
        - type: object
          required: [legacyRecords, vocabularyHistory]
          properties:
            legacyRecords:
              type: array
              items:
                $ref: "#/components/schemas/LegacyItem"
            vocabularyHistory:
              type: array
              items:
                type: object
                required: [id, reviewType, status, title, detail]
                properties:
                  id:
                    type: string
                  reviewType:
                    type: string
                  status:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
    CanonicalItemPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CanonicalItem"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CreateCanonicalItemInput:
      type: object
      required: [legacyItemIds]
      properties:
        legacyItemIds:
          type: array
          minItems: 1
          items:
            type: string
        nomenclature:
          type: ["string", "null"]
        unit:
          type: ["string", "null"]
        pvms:
          type: ["string", "null"]
        niv:
          type: ["string", "null"]
    VocabularyReview:
      type: object
      required: [id, importId, reviewType, identifier, title, detail, status, candidateRecords]
      properties:
        id:
          type: string
        importId:
          type: string
        reviewType:
          type: string
        identifier:
          type: ["string", "null"]
        title:
          type: string
        detail:
          type: string
        status:
          type: string
        decision:
          type: ["string", "null"]
        decisionNote:
          type: ["string", "null"]
        candidateRecords:
          type: array
          items:
            $ref: "#/components/schemas/LegacyItem"
    VocabularyReviewPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyReview"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    VocabularyDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [MERGE, KEEP_SEPARATE, CORRECT, RETIRE, CREATE_CANONICAL, INVESTIGATE]
        note:
          type: string
        canonicalItemIds:
          type: array
          items:
            type: string
        sourceColumnStart:
          type: integer
        nomenclature:
          type: ["string", "null"]
        unit:
          type: ["string", "null"]
        pvms:
          type: ["string", "null"]
        niv:
          type: ["string", "null"]
    Overview:
      type: object
      required: [cycle, baseline, quality, departments, recentActivity]
      properties:
        cycle:
          type: object
          required: [name, status, deadline, daysRemaining]
          properties:
            name:
              type: string
            status:
              type: string
            deadline:
              type: string
            daysRemaining:
              type: integer
        baseline:
          type: object
          required: [rowCount, departmentCount, uniqueIdentifiers, currentImportStatus]
          properties:
            rowCount:
              type: integer
            departmentCount:
              type: integer
            uniqueIdentifiers:
              type: integer
            currentImportStatus:
              type: string
        quality:
          type: object
          required: [conflicts, warnings, unresolved]
          properties:
            conflicts:
              type: integer
            warnings:
              type: integer
            unresolved:
              type: integer
        departments:
          type: object
          required: [total, ready, inProgress, needsReview]
          properties:
            total:
              type: integer
            ready:
              type: integer
            inProgress:
              type: integer
            needsReview:
              type: integer
        recentActivity:
          type: array
          items:
            type: object
            required: [id, action, detail, timestamp, tone]
            properties:
              id:
                type: string
              action:
                type: string
              detail:
                type: string
              timestamp:
                type: string
              tone:
                type: string
                enum: [neutral, success, warning, critical]

